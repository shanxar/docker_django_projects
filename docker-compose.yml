services:
  app1:
    build: ./app1
    ports:
      - "8000:8000"
    depends_on:
      - app2
    networks:
      - student-course_network

  app2:
    build: ./app2
    ports:
      - "8001:8000"
    networks:
      - student-course_network

networks:
    student-course_network:
      driver: bridge